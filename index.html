<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Поймай фрагмент</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#030814;
    touch-action:none; user-select:none; -webkit-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#eaf2ff;
  }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hud {
    position:fixed; top:0; left:0; right:0; z-index:5;
    padding:14px 16px calc(env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    text-align:center; pointer-events:none;
    background:linear-gradient(180deg, rgba(3,8,20,.85), rgba(3,8,20,0));
  }
  #hud .ttl { font-size:18px; font-weight:900; letter-spacing:.3px; }
  #hud .ttl b { color:#7cc4ff; }
  #hud .sub { margin-top:4px; font-size:13px; opacity:.8; }
  #tip {
    position:fixed; left:0; right:0; bottom:0; z-index:5; text-align:center;
    padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));
    font-size:15px; font-weight:700; line-height:1.4; pointer-events:none;
    background:linear-gradient(0deg, rgba(3,8,20,.9), rgba(3,8,20,0));
    color:#ffe9a8;
  }
  #tip .arrow { display:inline-block; animation:bob 1.1s ease-in-out infinite; font-size:20px; vertical-align:middle; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  #win {
    position:fixed; inset:0; z-index:6; display:none; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; pointer-events:none;
    background:radial-gradient(circle at 50% 40%, rgba(40,90,160,.35), rgba(3,8,20,.55));
  }
  #win.show { display:flex; }
  #win .big { font-size:64px; line-height:1; }
  #win .txt { margin-top:10px; font-size:22px; font-weight:900; color:#fff; }
</style>
</head>
<body>
  <div id="hud">
    <div class="ttl">Поймай фрагмент <b id="codeLbl">—</b></div>
    <div class="sub">Бросков: <span id="throwsLbl">0</span></div>
  </div>

  <canvas id="c"></canvas>

  <div id="tip">Зажми шар пальцем и <span class="arrow">⬆</span> дёрни <b>вверх</b> к подарку</div>

  <div id="win">
    <div class="big">🎉</div>
    <div class="txt">Фрагмент пойман!</div>
  </div>

<script>
(function () {
  'use strict';

  // ---- параметры из URL (их передаёт мост) ----
  var params = new URLSearchParams(location.search);
  var TARGET = params.get('target') || '47';
  var DIFF   = (params.get('difficulty') || 'normal').toLowerCase();
  var ORIGIN = params.get('origin') || '';
  if (!ORIGIN || ORIGIN === 'null') ORIGIN = '*';

  // ---- настройки сложности (размер/поведение цели) ----
  var CFG = {
    easy:    { r: 64, sway: 6,  spin: 0.0006, bob: 0.0010 },
    normal:  { r: 50, sway: 14, spin: 0.0012, bob: 0.0016 },
    hard:    { r: 38, sway: 24, spin: 0.0020, bob: 0.0022 },
    legendary:{ r: 44, sway: 30, spin: 0.0024, bob: 0.0026 }
  };
  var conf = CFG[DIFF] || CFG.normal;

  // ---- физика броска (CSS px, мс). Крути эти числа под вкус. ----
  var GRAVITY     = 0.0016;  // притяжение вниз
  var SWIPE_FORCE = 0.011;   // сила = длина_свайпа * это
  var MAX_SPEED   = 2.7;     // потолок скорости
  var MIN_SWIPE   = 28;      // мин. длина свайпа, чтобы бросить
  var BALL_R      = 24;      // радиус шара

  // ---- canvas ----
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  // ---- позиции ----
  var ball = { x:0, y:0, vx:0, vy:0, rot:0, flying:false };
  var target = { bx:0, by:0, x:0, y:0, rot:0, t:0 };
  var startX = 0, startY = 0;   // куда шар возвращается
  var goalX = 0, goalY = 0;     // центр зоны цели (для столкновений)

  function layout() {
    startX = W * 0.5;
    startY = H * 0.72;          // ШАР ВЫШЕ НИЗА — на 72% высоты
    goalX  = W * 0.5;
    goalY  = H * 0.30;          // подарок в верхней трети
    if (!ball.flying && state === 'aim') { ball.x = startX; ball.y = startY; }
  }

  // ---- состояние ----
  var state = 'aim';            // aim | dragging | flying | win
  var throws = 0;
  var drag = { active:false, sx:0, sy:0, cx:0, cy:0 };
  var winAt = 0;
  var particles = [];

  // ---- HUD ----
  document.getElementById('codeLbl').textContent = TARGET;
  var throwsLbl = document.getElementById('throwsLbl');
  var tipEl = document.getElementById('tip');
  var winEl = document.getElementById('win');

  // ---- ввод (pointer = и тач, и мышь) ----
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function nearBall(p) {
    var dx = p.x - ball.x, dy = p.y - ball.y;
    return (dx*dx + dy*dy) <= (BALL_R + 34) * (BALL_R + 34); // щедрая зона нажатия
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (state !== 'aim') return;
    var p = pos(e);
    if (!nearBall(p)) return;       // трогать можно только шар / зону вокруг
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    drag.active = true; drag.sx = p.x; drag.sy = p.y; drag.cx = p.x; drag.cy = p.y;
    state = 'dragging';
    tipEl.style.opacity = '0';
  }, { passive:false });

  canvas.addEventListener('pointermove', function (e) {
    if (state !== 'dragging' || !drag.active) return;
    e.preventDefault();
    var p = pos(e);
    drag.cx = p.x; drag.cy = p.y;
  }, { passive:false });

  function endDrag(e) {
    if (state !== 'dragging') return;
    e && e.preventDefault && e.preventDefault();
    drag.active = false;

    var dx = drag.cx - drag.sx;
    var dy = drag.cy - drag.sy;
    var len = Math.hypot(dx, dy);

    // бросаем только если дёрнули ВВЕРХ и достаточно сильно
    if (len < MIN_SWIPE || dy > -8) {
      state = 'aim';
      tipEl.style.opacity = '1';
      return;
    }

    var speed = Math.min(len * SWIPE_FORCE, MAX_SPEED);
    var nx = dx / len, ny = dy / len;
    ball.vx = nx * speed;
    ball.vy = ny * speed;          // отрицательный = вверх
    ball.flying = true;
    ball.rot = 0;
    throws++;
    throwsLbl.textContent = String(throws);
    state = 'flying';
  }
  canvas.addEventListener('pointerup', endDrag, { passive:false });
  canvas.addEventListener('pointercancel', endDrag, { passive:false });

  // не даём странице скроллиться/зумиться пальцами
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive:false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // ---- предпросмотр траектории ----
  function previewPath() {
    var dx = drag.cx - drag.sx, dy = drag.cy - drag.sy;
    var len = Math.hypot(dx, dy);
    if (len < MIN_SWIPE || dy > -8) return null;
    var speed = Math.min(len * SWIPE_FORCE, MAX_SPEED);
    var nx = dx / len, ny = dy / len;
    var vx = nx * speed, vy = ny * speed;
    var x = ball.x, y = ball.y, pts = [];
    for (var i = 0; i < 90; i++) {
      x += vx * 16; y += vy * 16; vy += GRAVITY * 16;
      if (i % 3 === 0) pts.push({ x:x, y:y });
      if (y < -40 || x < -40 || x > W + 40) break;
    }
    return pts;
  }

  // ---- столкновение с целью ----
  function hit() {
    var dx = ball.x - target.x, dy = ball.y - target.y;
    return Math.hypot(dx, dy) < (conf.r + BALL_R * 0.55);
  }

  function burst(x, y) {
    var cols = ['#ffd54f','#f48fb1','#7cc4ff','#ce93d8','#fff3c4','#7CFC9A'];
    for (var i = 0; i < 60; i++) {
      var a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
      particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, g:0.06,
        life:50+Math.random()*40, max:90, size:3+Math.random()*4, col:cols[i%cols.length] });
    }
  }

  function doWin() {
    state = 'win';
    winAt = performance.now();
    burst(target.x, target.y);
    winEl.classList.add('show');
    tipEl.style.display = 'none';
    // даём анимации отыграть, потом сигналим мосту
    setTimeout(function () {
      try {
        parent.postMessage({ type:'pq2_success', id:String(TARGET), perfect: throws <= 1 }, ORIGIN);
      } catch (_) {}
    }, 850);
  }

  // ---- рисование ----
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a1730'); g.addColorStop(1, '#030814');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // звёзды
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (var i = 0; i < 40; i++) {
      var sx = (i * 97.13) % W, sy = (i * 53.7) % (H * 0.6);
      var tw = 0.4 + 0.6 * Math.abs(Math.sin(performance.now()/700 + i));
      ctx.globalAlpha = tw * 0.6;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawTarget() {
    ctx.save();
    ctx.translate(target.x, target.y);
    ctx.rotate(target.rot);
    // ореол-зона попадания
    ctx.beginPath(); ctx.arc(0, 0, conf.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(124,196,255,.10)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(124,196,255,.45)';
    ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
    // подарок
    ctx.font = Math.round(conf.r * 1.5) + 'px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🎁', 0, 2);
    ctx.restore();
  }

  function drawBall(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    // тень
    ctx.beginPath(); ctx.ellipse(0, r*0.9, r*0.8, r*0.25, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    // верх красный
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = '#e23b3b'; ctx.fill();
    // низ белый
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath();
    ctx.fillStyle = '#f4f6fb'; ctx.fill();
    // полоса
    ctx.fillStyle = '#10131c'; ctx.fillRect(-r, -r*0.16, r*2, r*0.32);
    // кнопка
    ctx.beginPath(); ctx.arc(0, 0, r*0.26, 0, Math.PI*2);
    ctx.fillStyle = '#10131c'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r*0.16, 0, Math.PI*2);
    ctx.fillStyle = '#f4f6fb'; ctx.fill();
    // блик
    ctx.beginPath(); ctx.arc(-r*0.35, -r*0.4, r*0.18, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    ctx.restore();
  }

  function drawPad() {
    // подставка под шаром, когда он в старте
    ctx.beginPath();
    ctx.ellipse(startX, startY + BALL_R + 8, BALL_R*1.5, 7, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(124,196,255,.18)'; ctx.fill();
  }

  function drawDragUI() {
    // линия от шара к пальцу
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(drag.cx, drag.cy);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,233,168,.7)'; ctx.stroke();
    // предпросмотр траектории
    var pts = previewPath();
    if (pts) {
      ctx.fillStyle = 'rgba(124,196,255,.85)';
      for (var i = 0; i < pts.length; i++) {
        ctx.globalAlpha = 1 - i/pts.length;
        ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 3.2, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // маркер в конце
      if (pts.length) {
        var last = pts[pts.length-1];
        ctx.beginPath(); ctx.arc(last.x, last.y, 5, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,233,168,.9)'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= 1;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  // ---- цикл ----
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(now - last, 50); last = now;

    // движение цели
    target.t += dt;
    target.rot += conf.spin * dt;
    target.x = goalX + Math.sin(target.t * conf.bob) * conf.sway;
    target.y = goalY + Math.cos(target.t * conf.bob * 0.8) * conf.sway * 0.6;

    // физика шара
    if (state === 'flying') {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.vy += GRAVITY * dt;
      ball.rot += 0.012 * dt;
      if (hit()) { doWin(); }
      else if (ball.y < -BALL_R*2 || ball.y > H + BALL_R*2 || ball.x < -BALL_R*2 || ball.x > W + BALL_R*2) {
        // промах — возврат на старт
        ball.flying = false; ball.x = startX; ball.y = startY; ball.vx = 0; ball.vy = 0;
        state = 'aim';
        tipEl.style.opacity = '1';
      }
    }

    // рисуем
    drawBackground();
    drawTarget();
    if (state === 'aim') drawPad();
    if (state === 'dragging') drawDragUI();
    drawBall(ball.x, ball.y, BALL_R, ball.rot);
    drawParticles(dt);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });

  resize();
  ball.x = startX; ball.y = startY;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
